ty;\n        total += itemTotal;\n        \n        const itemElement = document.createElement('div');\n        itemElement.className = 'cart-item';\n        itemElement.innerHTML = `\n            <span>${item.name} x ${item.quantity}</span>\n            <span>$${itemTotal}</span>\n        `;\n        cartItemsContainer.appendChild(itemElement);\n    });\n    \n    totalAmountElement.textContent = total;\n}\n\n// 送出訂單\nasync function submitOrder() {\n    if (cartItems.length === 0) {\n        alert('請先選擇餐點');\n        return;\n    }\n    \n    try {\n        const response = await fetch('api/order', {\n            method: 'POST',\n            headers: {\n                'Content-Type': 'application/json'\n            },\n            body: JSON.stringify({ items: cartItems })\n        });\n        \n        if (!response.ok) {\n            throw new Error('送出訂單失敗');\n        }\n        \n        const data = await response.json();\n        alert('訂單已成功送出！');\n        cartItems.length = 0; // 清空購物車\n        renderCart();\n        fetchOrders(); // 更新訂單列表\n    } catch (error) {\n        console.error('錯誤:', error);\n        alert('送出訂單時發生錯誤');\n    }\n}\n\n// 渲染訂單列表\nfunction renderOrders() {\n    const ordersListContainer = document.getElementById('orders-list');\n    ordersListContainer.innerHTML = '';\n    \n    if (orders.length === 0) {\n        ordersListContainer.innerHTML = '<p>目前沒有訂單</p>';\n        return;\n    }\n    \n    orders.forEach(order => {\n        const orderElement = document.createElement('div');\n        orderElement.className = 'order-item';\n        orderElement.innerHTML = `\n            <h4>訂單編號: ${order.id}</h4>\n            <p>時間: ${new Date(order.timestamp).toLocaleString('zh-TW')}</p>\n            <ul>\n                ${order.items.map(item => `<li>${item.name} x ${item.quantity}</li>`).join('')}\n            </ul>\n            <p><strong>總計: $${order.total}</strong></p>\n        `;\n        ordersListContainer.appendChild(orderElement);