  app.js: "const canvas = document.getElementById('gameCanvas');\nconst ctx = canvas.getContext('2d');\n\n// 遊戲狀態\nlet gameRunning = false;\nlet playerScore = 0;\nlet computerScore = 0;\n\n// 球拍和球的屬性\nlet paddleWidth = 10;\nlet paddleHeight = 80;\nlet ballSize = 10;\n\nlet playerPaddle = {\n    x: 20,\n    y: canvas.height / 2 - paddleHeight / 2,\n    width: paddleWidth,\n    height: paddleHeight,\n    speed: 8\n};\n\nlet computerPaddle = {\n    x: canvas.width - 30,\n    y: canvas.height / 2 - paddleHeight / 2,\n    width: paddleWidth,\n    height: paddleHeight,\n    speed: 6\n};\n\nlet ball = {\n    x: canvas.width / 2,\n    y: canvas.height / 2,\n    size: ballSize,\n    dx: 5,\n    dy: 5,\n    speed: 5\n};\n\n// 初始化遊戲\nfunction initGame() {\n    playerScore = 0;\n    computerScore = 0;\n    updateScore();\n    resetBall();\n    gameRunning = true;\n}\n\n// 重置球的位置\nfunction resetBall() {\n    ball.x = canvas.width / 2;\n    ball.y = canvas.height / 2;\n    \n    // 隨機方向\n    ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;\n    ball.dy = (Math.random() * 2 - 1) * ball.speed;\n}\n\n// 更新得分顯示\nfunction updateScore() {\n    document.getElementById('player-score').textContent = `玩家: ${playerScore}`;\n    document.getElementById('computer-score').textContent = `電腦: ${computerScore}`;\n}\n\n// 繪製遊戲元素\nfunction draw() {\n    // 清除畫布\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n    \n    // 繪製球拍\n    ctx.fillStyle = '#000';\n    ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height);\n    ctx.fillRect(computerPaddle.x, computerPaddle.y, computerPaddle.width, computerPaddle.height);\n    \n    // 繪製球\n    ctx.beginPath();\n    ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);\n    ctx.fillStyle = '#000';\n    ctx.fill();\n    ctx.closePath();\n}\n\n// 更新遊戲狀態\nfunction update() {\n    if (!gameRunning) return;\n    \n    // 移動球\n    ball.x += ball.dx;\n    ball.y += ball.dy;\n    \n    // 球碰到上下邊界\n    if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {\n        ball.dy = -ball.dy;\n    }\n    \n    // 球碰到球拍\n    if (\n        ball.x - ball.size < playerPaddle.x + playerPaddle.width &&\n        ball.y > playerPaddle.y &&\n        ball.y < playerPaddle.y + playerPaddle.height &&\n        ball.dx < 0\n    ) {\n        ball.dx = -ball.dx;\n        // 根據球拍位置調整球的方向和速度\n        let hitPosition = (ball.y - (playerPaddle.y + playerPaddle.height / 2)) / (playerPaddle.height / 2);\n        ball.dy = hitPosition * 5;\n    }\n    \n    if (\n        ball.x + ball.size > computerPaddle.x &&\n        ball.y > computerPaddle.y &&\n        ball.y < computerPaddle.y + computerPaddle.height &&\n        ball.dx > 0\n    ) {\n        ball.dx = -ball.dx;\n        // 根據球拍位置調整球的方向和速度\n        let hitPosition = (ball.y - (computerPaddle.y + computerPaddle.height / 2)) / (computerPaddle.height / 2);\n        ball.dy = hitPosition * 5;\n    }\n    \n    // 球出界\n    if (ball.x < 0) {\n        computerScore++;\n        updateScore();\n        resetBall();\n    } else if (ball.x > canvas.width) {\n        playerScore++;\n        updateScore();\n        resetBall();\n    }\n    \n    // 電腦球拍追蹤球\n    computerPaddle.y += (ball.y - (computerPaddle.y + computerPaddle.height / 2)) * 0.05;\n    \n    // 限制電腦球拍移動範圍\n    if (computerPaddle.y < 0) {\n        computerPaddle.y = 0;\n    } else if (computerPaddle.y + computerPaddle.height > canvas.height) {\n        computerPaddle.y = canvas.height - computerPaddle.height;\n    }\n    \n    // 更新畫面\n    draw();\n}\n\n// 遊戲主循環\nfunction gameLoop() {\n    update();\n    requestAnimationFrame(gameLoop);\n}\n\n// 控制球拍移動\nfunction movePaddle(direction) {\n    if (!gameRunning) return;\n    \n    fetch('api/paddle/move', {\n        method: 'PUT',\n        headers: {\n            'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({ direction })\n    });\n}\n\n// 開始遊戲\nfunction startGame() {\n    if (gameRunning) return;\n    \n    fetch('api/game/start', {\n        method: 'POST',\n        headers: {\n            'Content-Type': 'application/json'\n        }\n    }).then(response => response.json()).then(data => {\n        initGame();\n    });\n}\n\n// 重置遊戲\nfunction resetGame() {\n    fetch('api/game/reset', {\n        method: 'POST',\n        headers: {\n            'Content-Type': 'application/json'\n        }\n    }).then(response => response.json()).then(data => {\n        initGame();\n    });\n}\n\n// 設置事件監聽器\ndocument.getElementById('startBtn').addEventListener('click', startGame);\ndocument.getElementById('resetBtn').addEventListener('click', resetGame);\n\n// 鼠標控制球拍\ncanvas.addEventListener('mousemove', (e) => {\n    if (!gameRunning) return;\n    \n    const rect = canvas.getBoundingClientRect();\n    const mouseY = e.clientY - rect.top;\n    \n    playerPaddle.y = mouseY - playerPaddle.height / 2;\n    \n    // 限制球拍移動範圍\n    if (playerPaddle.y < 0) {\n        playerPaddle.y = 0;\n    } else if (playerPaddle.y + playerPaddle.height > canvas.height) {\n        playerPaddle.y = canvas.height - playerPaddle.height;\n    }\n    \n    // 發送球拍位置更新到伺服器\n    fetch('api/paddle/move', {\n        method: 'PUT',\n        headers: {\n            'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({ y: playerPaddle.y })\n    });\n});\n\n// 初始化遊戲\ninitGame();\ngameLoop();"
