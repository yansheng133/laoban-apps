    """laoban web server (fixed template, not generated by AI).

    Serves the three static files mounted from the ConfigMap and forwards
    every request under api/ to the API service, stripping the api/ prefix.
    The page is opened through the Rancher service proxy, which removes the
    proxy prefix before the request reaches this server, so the page itself
    must use relative URLs only. Python standard library only.

    Environment:
      LAOBAN_STATIC_DIR  directory holding the static files (default /app)
      LAOBAN_API_URL     base URL of the API service, e.g. http://demo-api:8080/
      PORT               listen port (default 8080; 0 picks a free port)
    """

    import http.server
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    STATIC_DIR = os.environ.get("LAOBAN_STATIC_DIR", "/app")
    API_URL = os.environ.get("LAOBAN_API_URL", "")
    PORT = int(os.environ.get("PORT", "8080"))
    MAX_BODY = 1024 * 1024
    TIMEOUT_SECONDS = 30

    # Only these files are served; server.py itself is not.
    FILES = {
        "index.html": "text/html; charset=utf-8",
        "app.js": "text/javascript; charset=utf-8",
        "style.css": "text/css; charset=utf-8",
    }

    # Never use a proxy from the environment for the in-cluster API call.
    OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}))


    class Handler(http.server.BaseHTTPRequestHandler):
        server_version = "laoban-web"
        sys_version = ""
        protocol_version = "HTTP/1.0"

        def _send(self, status, body, content_type):
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("X-Content-Type-Options", "nosniff")
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(body)

        def _text(self, status, message):
            self._send(status, (message + "\n").encode("utf-8"), "text/plain; charset=utf-8")

        def _route(self):
            path = urllib.parse.urlsplit(self.path).path
            if path == "/api" or path.startswith("/api/"):
                self._proxy(path)
                return
            if self.command not in ("GET", "HEAD"):
                self._text(405, "method not allowed")
                return
            name = path.lstrip("/") or "index.html"
            content_type = FILES.get(name)
            if content_type is None:
                self._text(404, "not found")
                return
            try:
                with open(os.path.join(STATIC_DIR, name), "rb") as f:
                    body = f.read()
            except OSError:
                self._text(404, "not found")
                return
            self._send(200, body, content_type)

        def _proxy(self, path):
            if not API_URL:
                self._text(502, "api not configured")
                return
            try:
                length = int(self.headers.get("Content-Length") or 0)
            except ValueError:
                self._text(400, "bad content-length")
                return
            if length < 0 or length > MAX_BODY:
                self._text(413, "request body too large")
                return
            body = self.rfile.read(length) if length else None

            rest = path[len("/api"):].lstrip("/")
            target = API_URL.rstrip("/") + "/" + rest
            query = urllib.parse.urlsplit(self.path).query
            if query:
                target += "?" + query
            headers = {}
            for name in ("Content-Type", "Accept"):
                value = self.headers.get(name)
                if value:
                    headers[name] = value
            request = urllib.request.Request(target, data=body, method=self.command, headers=headers)
            try:
                with OPENER.open(request, timeout=TIMEOUT_SECONDS) as resp:
                    status = resp.status
                    content_type = resp.headers.get("Content-Type", "application/json")
                    data = resp.read(MAX_BODY)
            except urllib.error.HTTPError as err:
                status = err.code
                content_type = err.headers.get("Content-Type", "application/json")
                data = err.read(MAX_BODY)
            except (urllib.error.URLError, OSError):
                self._send(502, b'{"error":"api unavailable"}', "application/json")
                return
            self._send(status, data, content_type)

        do_GET = _route
        do_HEAD = _route
        do_POST = _route
        do_PUT = _route
        do_PATCH = _route
        do_DELETE = _route


    def main():
        server = http.server.ThreadingHTTPServer(("", PORT), Handler)
        server.daemon_threads = True
        print("laoban-web listening on port %d" % server.server_address[1], file=sys.stderr, flush=True)
        server.serve_forever()


    if __name__ == "__main__":
        main()
  style.css: |
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #fdf6ec;
      color: #333;
    }
    header {
      background: #e67e22;
      color: #fff;
      padding: 12px 16px 0;
    }
    header h1 { margin: 0 0 8px; font-size: 1.4rem; }
    .tabs { display: flex; gap: 4px; }
    .tab {
      border: none;
      background: #f0a35e;
      color: #fff;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
    }
    .tab.active { background: #fdf6ec; color: #e67e22; font-weight: bold; }
    main { max-width: 800px; margin: 0 auto; padding: 16px; }
    h2 { font-size: 1.2rem; border-left: 4px solid #e67e22; padding-left: 8px; }
    .panel[hidden], [hidden] { display: none !important; }
    .menu-list, .cart-list, .orders-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-item, .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,.1);
    }
    .menu-info { display: flex; flex-direction: column; }
    .menu-name { font-weight: bold; }
    .menu-price { color: #888; font-size: .9rem; }
    .qty-ctl { display: flex; align-items: center; gap: 10px; }
    .qty-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #e67e22;
      background: #fff;
      color: #e67e22;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .qty { min-width: 24px; text-align: center; font-weight: bold; }
    .cart-row span:nth-child(2) { margin-left: auto; margin-right: 16px; }
    .cart-total { text-align: right; font-size: 1.1rem; font-weight: bold; }
    form fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 0 0 12px; }
    form fieldset label { margin-right: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 4px; }
    .field input, select {
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button { font-family: inherit; }
    button.primary {
      background: #e67e22;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1.05rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .message { padding: 10px 12px; border-radius: 6px; margin: 12px 0; }
    .message.error { background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; }
    .message.success { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
    .empty { color: #888; font-style: italic; }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar button {
      padding: 8px 14px;
      border: 1px solid #e67e22;
      background: #fff;
      color: #e67e22;
      border-radius: 6px;
      cursor: pointer;
    }
    .order-card {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      border-left: 6px solid #bbb;
      box-shadow: 0 1px 2px rgba(0,0,0,.1);
    }
    .order-card.status-pending { border-left-color: #e53935; }
    .order-card.status-preparing { border-left-color: #fb8c00; }
    .order-card.status-done { border-left-color: #43a047; }
    .order-head { display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #eee; padding: 2px 10px; border-radius: 12px; font-size: .85rem; }
    .order-time { color: #888; font-size: .85rem; margin: 4px 0; }
    .order-lines { margin: 6px 0; padding-left: 20px; }
    .order-total { font-weight: bold; }
    .order-actions { display: flex; gap: 6px; margin-top: 8px; }
    .status-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #e67e22;
      background: #fff;
      color: #e67e22;
      border-radius: 6px;
      cursor: pointer;
    }
    .status-btn.current { background: #e67e22; color: #fff; opacity: 1; }
    .stats-cards { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat-card {
      flex: 1;
      min-width: 140px;
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,.1);
    }
    .stat-label { color: #888; }
    .stat-value { font-size: 1.8rem; font-weight: bold; color: #e67e22; }
    .top-list li { margin-bottom: 6px; }
