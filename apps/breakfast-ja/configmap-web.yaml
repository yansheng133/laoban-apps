  server.py: |
    """laoban web server (fixed template, not generated by AI).

    Serves the three static files mounted from the ConfigMap and forwards
    every request under api/ to the API service, stripping the api/ prefix.
    The page is opened through the Rancher service proxy, which removes the
    proxy prefix before the request reaches this server, so the page itself
    must use relative URLs only. Python standard library only.

    Environment:
      LAOBAN_STATIC_DIR  directory holding the static files (default /app)
      LAOBAN_API_URL     base URL of the API service, e.g. http://demo-api:8080/
      PORT               listen port (default 8080; 0 picks a free port)
    """

    import http.server
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    STATIC_DIR = os.environ.get("LAOBAN_STATIC_DIR", "/app")
    API_URL = os.environ.get("LAOBAN_API_URL", "")
    PORT = int(os.environ.get("PORT", "8080"))
    MAX_BODY = 1024 * 1024
    TIMEOUT_SECONDS = 30

    # Only these files are served; server.py itself is not.
    FILES = {
        "index.html": "text/html; charset=utf-8",
        "app.js": "text/javascript; charset=utf-8",
        "style.css": "text/css; charset=utf-8",
    }

    # Never use a proxy from the environment for the in-cluster API call.
    OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}))


    class Handler(http.server.BaseHTTPRequestHandler):
        server_version = "laoban-web"
        sys_version = ""
        protocol_version = "HTTP/1.0"

        def _send(self, status, body, content_type):
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("X-Content-Type-Options", "nosniff")
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(body)

        def _text(self, status, message):
            self._send(status, (message + "\n").encode("utf-8"), "text/plain; charset=utf-8")

        def _route(self):
            path = urllib.parse.urlsplit(self.path).path
            if path == "/api" or path.startswith("/api/"):
                self._proxy(path)
                return
            if self.command not in ("GET", "HEAD"):
                self._text(405, "method not allowed")
                return
            name = path.lstrip("/") or "index.html"
            content_type = FILES.get(name)
            if content_type is None:
                self._text(404, "not found")
                return
            try:
                with open(os.path.join(STATIC_DIR, name), "rb") as f:
                    body = f.read()
            except OSError:
                self._text(404, "not found")
                return
            self._send(200, body, content_type)

        def _proxy(self, path):
            if not API_URL:
                self._text(502, "api not configured")
                return
            try:
                length = int(self.headers.get("Content-Length") or 0)
            except ValueError:
                self._text(400, "bad content-length")
                return
            if length < 0 or length > MAX_BODY:
                self._text(413, "request body too large")
                return
            body = self.rfile.read(length) if length else None

            rest = path[len("/api"):].lstrip("/")
            target = API_URL.rstrip("/") + "/" + rest
            query = urllib.parse.urlsplit(self.path).query
            if query:
                target += "?" + query
            headers = {}
            for name in ("Content-Type", "Accept"):
                value = self.headers.get(name)
                if value:
                    headers[name] = value
            request = urllib.request.Request(target, data=body, method=self.command, headers=headers)
            try:
                with OPENER.open(request, timeout=TIMEOUT_SECONDS) as resp:
                    status = resp.status
                    content_type = resp.headers.get("Content-Type", "application/json")
                    data = resp.read(MAX_BODY)
            except urllib.error.HTTPError as err:
                status = err.code
                content_type = err.headers.get("Content-Type", "application/json")
                data = err.read(MAX_BODY)
            except (urllib.error.URLError, OSError):
                self._send(502, b'{"error":"api unavailable"}', "application/json")
                return
            self._send(status, data, content_type)

        do_GET = _route
        do_HEAD = _route
        do_POST = _route
        do_PUT = _route
        do_PATCH = _route
        do_DELETE = _route


    def main():
        server = http.server.ThreadingHTTPServer(("", PORT), Handler)
        server.daemon_threads = True
        print("laoban-web listening on port %d" % server.server_address[1], file=sys.stderr, flush=True)
        server.serve_forever()


    if __name__ == "__main__":
        main()
  style.css: |
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
      background: #faf6ef;
      color: #2b2b2b;
      line-height: 1.5;
    }

    header {
      background: #c8531d;
      color: #fff;
      padding: 12px 16px 0;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    .tabs {
      display: flex;
      gap: 4px;
    }

    .tab {
      flex: 1;
      max-width: 160px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px 8px 0 0;
      background: #e07b4a;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    .tab.active {
      background: #faf6ef;
      color: #c8531d;
      font-weight: bold;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    h2 { margin-top: 0; font-size: 1.2rem; }
    h2.section-title { margin-top: 28px; }

    button {
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.primary {
      background: #c8531d;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
    }

    button.secondary {
      background: #fff;
      color: #c8531d;
      border: 1px solid #c8531d;
      border-radius: 8px;
      padding: 8px 16px;
    }

    .menu-list, .order-list, .order-items, .stock-list, .top-items {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid #e6dccb;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .menu-item.sold-out {
      background: #ececec;
      border-color: #d4d4d4;
      color: #8a8a8a;
    }

    .menu-item.sold-out .menu-price { color: #9a9a9a; }
    .menu-item.sold-out .menu-name { text-decoration: line-through; }

    .sold-out-tag {
      background: #777;
      color: #fff;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .menu-info { display: flex; flex-direction: column; }
    .menu-name { font-weight: bold; }
    .menu-price { color: #666; font-size: 0.9rem; }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-control button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #c8531d;
      background: #fff;
      color: #c8531d;
      font-size: 1.3rem;
      line-height: 1;
    }

    .menu-item.sold-out .qty-control button {
      border-color: #aaa;
      color: #aaa;
      background: #f4f4f4;
    }

    .qty {
      min-width: 28px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .order-form {
      background: #fff;
      border: 1px solid #e6dccb;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
    }

    .order-form label, .filter label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .order-type {
      border: none;
      margin: 12px 0 0;
      padding: 0;
    }

    .order-type legend {
      font-weight: bold;
      padding: 0;
      margin-bottom: 4px;
    }

    .order-form .radio-label {
      display: inline-block;
      font-weight: normal;
      margin-right: 18px;
      cursor: pointer;
    }

    input[type='number'], select {
      font-family: inherit;
      font-size: 1rem;
      padding: 8px 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      width: 100%;
      max-width: 220px;
    }

    .cart-total { font-size: 1.1rem; }

    .filter { margin-bottom: 12px; }

    .message { min-height: 1.4em; margin: 8px 0 0; }
    .message.error { color: #b00020; }
    .message.ok { color: #1b7a2f; }

    .order {
      background: #fff;
      border: 1px solid #ddd;
      border-left-width: 8px;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .order.status-todo { border-left-color: #d32f2f; background: #fdeeee; }
    .order.status-doing { border-left-color: #f59f00; background: #fff6e0; }
    .order.status-done { border-left-color: #2e9e4f; background: #eaf7ee; }

    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .order-title { font-weight: bold; }

    .type-label {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      vertical-align: middle;
    }

    .type-label.type-dine { background: #1c6ea4; }
    .type-label.type-take { background: #7b3fa0; }

    .badge {
      padding: 2px 12px;
      border-radius: 999px;
      color: #fff;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .status-todo .badge { background: #d32f2f; }
    .status-doing .badge { background: #e68a00; }
    .status-done .badge { background: #2e9e4f; }

    .order-time { color: #666; font-size: 0.85rem; margin-bottom: 6px; }

    .order-items li { padding: 2px 0; }

    .order-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      gap: 8px;
    }

    .order-total { font-weight: bold; }

    .empty { color: #777; padding: 12px 0; }

    .stock-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #e6dccb;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .stock-item.sold-out {
      background: #ececec;
      border-color: #d4d4d4;
      color: #8a8a8a;
    }

    .stock-name { flex: 1; font-weight: bold; }
    .stock-state { font-size: 0.9rem; color: #1b7a2f; }
    .stock-item.sold-out .stock-state { color: #777; }

    .sales-cards {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card {
      flex: 1;
      min-width: 180px;
      background: #fff;
      border: 1px solid #e6dccb;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .card-label { color: #666; }
    .card-value { font-size: 2rem; font-weight: bold; color: #c8531d; }

    .note { color: #666; font-size: 0.9rem; }

    .top-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #e6dccb;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .top-item .rank {
      min-width: 44px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #c8531d;
    }

    .top-item.rank-1 { background: #fff6e0; border-color: #f0c869; }
    .top-item.rank-1 .rank { color: #b07800; font-size: 1.3rem; }
    .top-item.rank-2 .rank { color: #6b6b6b; }
    .top-item.rank-3 .rank { color: #9a5b2c; }

    .top-name { flex: 1; font-weight: bold; }
    .top-count { font-weight: bold; color: #444; }
