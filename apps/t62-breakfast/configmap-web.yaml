ch (error) {\n      showError('從購物車刪除失敗', error.message);\n    }\n  }\n\n  // 提交訂單\n  async function submitOrder(orderData) {\n    try {\n      const response = await fetch('api/order', {\n        method: 'POST',\n        headers: {\n          'Content-Type': 'application/json',\n        },\n        body: JSON.stringify(orderData),\n      });\n      if (!response.ok) {\n        throw new Error(`提交訂單失敗: ${response.status} ${response.statusText}`);\n      }\n      const result = await response.json();\n      alert('訂單提交成功！');\n      // 重置購物車\n      cartItems = [];\n      renderCart();\n      // 顯示訂單列表\n      showOrders();\n      fetchOrders(); // 獲取最新的訂單列表\n    } catch (error) {\n      showError('提交訂單失敗', error.message);\n    }\n  }\n\n  // 顯示訂單列表\n  function showOrders() {\n    menuSection.classList.add('hidden');\n    cartSection.classList.add('hidden');\n    orderFormSection.classList.add('hidden');\n    ordersSection.classList.remove('hidden');\n  }\n\n  // 顯示結帳頁面\n  function showCheckout() {\n    menuSection.classList.add('hidden');\n    cartSection.classList.remove('hidden');\n    orderFormSection.classList.remove('hidden');\n    ordersSection.classList.add('hidden');\n  }\n\n  // 顯示錯誤訊息\n  function showError(title, message) {\n    alert(`${title}: ${message}`);\n  }\n\n  // 初始化\n  fetchMenu();\n  fetchCart();\n\n  // 綁定事件\n  checkoutBtn.addEventListener('click', showCheckout);\n\n  orderForm.addEventListener('submit', (e) => {\n    e.preventDefault();\n    const customerName = document.getElementById('customer-name').value;\n    const customerPhone = document.getElementById('customer-phone').value;\n    const customerAddress = document.getElementById('customer-address').value;\n\n    submitOrder({\n      customer_name: customerName,\n      customer_phone: customerPhone,\n      customer_address: customerAddress,\n      items: cartItems.map(item => ({\n        item_id: item.id,\n        quantity: item.quantity\n      }))\n    });\n  });\n});"
