    """laoban web server (fixed template, not generated by AI).

    Serves the three static files mounted from the ConfigMap and forwards
    every request under api/ to the API service, stripping the api/ prefix.
    The page is opened through the Rancher service proxy, which removes the
    proxy prefix before the request reaches this server, so the page itself
    must use relative URLs only. Python standard library only.

    Environment:
      LAOBAN_STATIC_DIR  directory holding the static files (default /app)
      LAOBAN_API_URL     base URL of the API service, e.g. http://demo-api:8080/
      PORT               listen port (default 8080; 0 picks a free port)
    """

    import http.server
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    STATIC_DIR = os.environ.get("LAOBAN_STATIC_DIR", "/app")
    API_URL = os.environ.get("LAOBAN_API_URL", "")
    PORT = int(os.environ.get("PORT", "8080"))
    MAX_BODY = 1024 * 1024
    TIMEOUT_SECONDS = 30

    # Only these files are served; server.py itself is not.
    FILES = {
        "index.html": "text/html; charset=utf-8",
        "app.js": "text/javascript; charset=utf-8",
        "style.css": "text/css; charset=utf-8",
    }

    # Never use a proxy from the environment for the in-cluster API call.
    OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}))


    class Handler(http.server.BaseHTTPRequestHandler):
        server_version = "laoban-web"
        sys_version = ""
        protocol_version = "HTTP/1.0"

        def _send(self, status, body, content_type):
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("X-Content-Type-Options", "nosniff")
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(body)

        def _text(self, status, message):
            self._send(status, (message + "\n").encode("utf-8"), "text/plain; charset=utf-8")

        def _route(self):
            path = urllib.parse.urlsplit(self.path).path
            if path == "/api" or path.startswith("/api/"):
                self._proxy(path)
                return
            if self.command not in ("GET", "HEAD"):
                self._text(405, "method not allowed")
                return
            name = path.lstrip("/") or "index.html"
            content_type = FILES.get(name)
            if content_type is None:
                self._text(404, "not found")
                return
            try:
                with open(os.path.join(STATIC_DIR, name), "rb") as f:
                    body = f.read()
            except OSError:
                self._text(404, "not found")
                return
            self._send(200, body, content_type)

        def _proxy(self, path):
            if not API_URL:
                self._text(502, "api not configured")
                return
            try:
                length = int(self.headers.get("Content-Length") or 0)
            except ValueError:
                self._text(400, "bad content-length")
                return
            if length < 0 or length > MAX_BODY:
                self._text(413, "request body too large")
                return
            body = self.rfile.read(length) if length else None

            rest = path[len("/api"):].lstrip("/")
            target = API_URL.rstrip("/") + "/" + rest
            query = urllib.parse.urlsplit(self.path).query
            if query:
                target += "?" + query
            headers = {}
            for name in ("Content-Type", "Accept"):
                value = self.headers.get(name)
                if value:
                    headers[name] = value
            request = urllib.request.Request(target, data=body, method=self.command, headers=headers)
            try:
                with OPENER.open(request, timeout=TIMEOUT_SECONDS) as resp:
                    status = resp.status
                    content_type = resp.headers.get("Content-Type", "application/json")
                    data = resp.read(MAX_BODY)
            except urllib.error.HTTPError as err:
                status = err.code
                content_type = err.headers.get("Content-Type", "application/json")
                data = err.read(MAX_BODY)
            except (urllib.error.URLError, OSError):
                self._send(502, b'{"error":"api unavailable"}', "application/json")
                return
            self._send(status, data, content_type)

        do_GET = _route
        do_HEAD = _route
        do_POST = _route
        do_PUT = _route
        do_PATCH = _route
        do_DELETE = _route


    def main():
        server = http.server.ThreadingHTTPServer(("", PORT), Handler)
        server.daemon_threads = True
        print("laoban-web listening on port %d" % server.server_address[1], file=sys.stderr, flush=True)
        server.serve_forever()


    if __name__ == "__main__":
        main()
  style.css: |
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; background: #faf6ef; color: #333; font-size: 17px; }
    .app-header { background: #c9791b; color: #fff; padding: 12px 16px 0; }
    .app-header h1 { margin: 0 0 10px; font-size: 1.4rem; }
    .tabs { display: flex; gap: 6px; }
    .tab { flex: 1; padding: 14px 8px; font-size: 1.05rem; border: none; border-radius: 10px 10px 0 0; background: #e3a65a; color: #fff; cursor: pointer; }
    .tab.active { background: #faf6ef; color: #8a4f0c; font-weight: bold; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    .hidden { display: none; }
    h2 { font-size: 1.2rem; margin: 8px 0 12px; }
    h3 { margin: 0 0 8px; }
    .muted { color: #888; }
    .panel { background: #fff; border-radius: 12px; padding: 16px; margin-top: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .menu-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .menu-info { display: flex; flex-direction: column; }
    .menu-name { font-weight: bold; font-size: 1.1rem; }
    .menu-price { color: #c9791b; }
    .qty-ctl { display: flex; align-items: center; gap: 10px; }
    .qty-btn { width: 44px; height: 44px; font-size: 1.5rem; border: none; border-radius: 50%; background: #c9791b; color: #fff; cursor: pointer; }
    .qty-btn:active { background: #8a4f0c; }
    .qty-num { min-width: 28px; text-align: center; font-size: 1.2rem; }
    .cart-list { list-style: none; padding: 0; margin: 0 0 8px; }
    .cart-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #ddd; }
    .total { font-size: 1.2rem; text-align: right; }
    .field { margin: 12px 0; }
    .label { display: block; margin-bottom: 6px; font-weight: bold; }
    .choice { display: inline-block; margin-right: 18px; padding: 8px 0; cursor: pointer; }
    .choice input { width: 20px; height: 20px; vertical-align: middle; }
    input[type=text] { width: 100%; padding: 12px; font-size: 1.1rem; border: 1px solid #bbb; border-radius: 8px; }
    button { font-family: inherit; }
    .primary { width: 100%; padding: 16px; font-size: 1.2rem; border: none; border-radius: 10px; background: #2e7d32; color: #fff; cursor: pointer; }
    .primary:disabled { background: #9bb99d; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; }
    .toolbar button { padding: 10px 16px; font-size: 1rem; border: 1px solid #c9791b; background: #fff; color: #8a4f0c; border-radius: 8px; cursor: pointer; }
    .msg { margin: 10px 0; min-height: 1.2em; }
    .msg.error { color: #b71c1c; background: #fdecea; padding: 10px; border-radius: 8px; }
    .msg.success { color: #1b5e20; background: #e8f5e9; padding: 10px; border-radius: 8px; }
    .orders-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .order-card { background: #fff; border-radius: 12px; padding: 14px; border-left: 8px solid #999; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .order-card.status-pending { border-left-color: #d32f2f; }
    .order-card.status-preparing { border-left-color: #f9a825; }
    .order-card.status-done { border-left-color: #2e7d32; opacity: 0.8; }
    .order-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .order-time { color: #777; font-size: 0.9rem; margin: 4px 0; }
    .order-items { margin: 8px 0; padding-left: 20px; }
    .order-total { font-weight: bold; margin-bottom: 8px; }
    .badge { padding: 3px 10px; border-radius: 12px; color: #fff; font-size: 0.9rem; white-space: nowrap; }
    .badge-pending { background: #d32f2f; }
    .badge-preparing { background: #f9a825; color: #333; }
    .badge-done { background: #2e7d32; }
    .order-actions { display: flex; gap: 6px; }
    .status-btn { flex: 1; padding: 12px 4px; font-size: 1rem; border: 2px solid #999; background: #fff; border-radius: 8px; cursor: pointer; }
    .btn-pending { border-color: #d32f2f; color: #d32f2f; }
    .btn-preparing { border-color: #f9a825; color: #8a6100; }
    .btn-done { border-color: #2e7d32; color: #2e7d32; }
    .btn-pending.current { background: #d32f2f; color: #fff; }
    .btn-preparing.current { background: #f9a825; color: #333; }
    .btn-done.current { background: #2e7d32; color: #fff; }
    .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 18px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .stat-label { display: block; color: #777; margin-bottom: 6px; }
    .stat-card strong { font-size: 1.8rem; color: #c9791b; }
    .top-list { margin: 0; padding-left: 24px; font-size: 1.1rem; line-height: 1.8; }
    @media (max-width: 480px) {
      body { font-size: 16px; }
      main { padding: 10px; }
    }
