le) return;\n\n    try {\n      const response = await fetch('api/todos', {\n        method: 'POST',\n        headers: {\n          'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({ title })\n      });\n\n      if (!response.ok) {\n        const errorData = await response.json();\n        throw new Error(errorData.error || '新增待辦事項失敗');\n      }\n\n      const newTodo = await response.json();\n      todos.push(newTodo);\n      renderTodos();\n      todoInput.value = '';\n    } catch (error) {\n      showError(error.message);\n    }\n  }\n\n  // 更新待辦事項狀態\n  async function updateTodoStatus(id, completed) {\n    try {\n      const response = await fetch(`api/todos/${id}`, {\n        method: 'PUT',\n        headers: {\n          'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({ completed })\n      });\n\n      if (!response.ok) {\n        const errorData = await response.json();\n        throw new Error(errorData.error || '更新待辦事項狀態失敗');\n      }\n\n      const updatedTodo = await response.json();\n      const todoIndex = todos.findIndex(todo => todo.id === id);\n      if (todoIndex !== -1) {\n        todos[todoIndex] = updatedTodo;\n        renderTodos();\n      }\n    } catch (error) {\n      showError(error.message);\n    }\n  }\n\n  // 刪除待辦事項\n  async function deleteTodo(id) {\n    try {\n      const response = await fetch(`api/todos/${id}`, {\n        method: 'DELETE'\n      });\n\n      if (!response.ok) {\n        const errorData = await response.json();\n        throw new Error(errorData.error || '刪除待辦事項失敗');\n      }\n\n      todos = todos.filter(todo => todo.id !== id);\n      renderTodos();\n    } catch (error) {\n      showError(error.message);\n    }\n  }\n\n  // 獲取所有待辦事項\n  async function fetchTodos() {\n    try {\n      const response = await fetch('api/todos');\n      if (!response.ok) {\n        const errorData = await response.json();\n        throw new Error(errorData.error || '獲取待辦事項失敗');\n     