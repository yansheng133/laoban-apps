  app.js: "const api = {\n    async get(endpoint) {\n        const response = await fetch(`api/${endpoint}`);\n        return response.json();\n    },\n    \n    async post(endpoint, data) {\n        const response = await fetch(`api/${endpoint}`, {\n            method: 'POST',\n            headers: {\n                'Content-Type': 'application/json'\n            },\n            body: JSON.stringify(data)\n        });\n        return response.json();\n    },\n    \n    async put(endpoint, data) {\n        const response = await fetch(`api/${endpoint}`, {\n            method: 'PUT',\n            headers: {\n                'Content-Type': 'application/json'\n            },\n            body: JSON.stringify(data)\n        });\n        return response.json();\n    },\n    \n    async delete(endpoint) {\n        const response = await fetch(`api/${endpoint}`, {\n            method: 'DELETE'\n        });\n        return response.json();\n    }\n};\n\nlet polls = [];\nlet currentPollId = null;\nlet browserId = localStorage.getItem('browserId') || generateBrowserId();\n\nif (!localStorage.getItem('browserId')) {\n    localStorage.setItem('browserId', browserId);\n}\n\nfunction generateBrowserId() {\n    return 'browser-' + Math.random().toString(36).substr(2, 9);\n}\n\n// 顯示建立投票表單\nfunction showCreateForm() {\n    document.getElementById('createForm').style.display = 'block';\n    document.getElementById('pollList').style.display = 'none';\n    document.getElementById('pollDetail').style.display = 'none';\n    document.getElementById('resultsContainer').style.display = 'none';\n}\n\n// 顯示投票列表\nfunction showPollList() {\n    document.getElementById('createForm').style.display = 'none';\n    document.getElementById('pollList').style.display = 'block';\n    document.getElementById('pollDetail').style.display = 'none';\n    document.getElementById('resultsContainer').style.display = 'none';\n    loadPolls();\n}\n\n// 載入投票列表\nasync function loadPolls() {\n    try {\n        polls = await api.get('polls');\n        const container = document.getElementById('pollsContainer');\n        \n        if (polls.length === 0) {\n            container.innerHTML = '<p>目前沒有任何投票</p>';\n            return;\n        }\n        \n        container.innerHTML = polls.map(poll => {\n            const isExpired = poll.expireTime && new Date(poll.expireTime) < new Date();\n            return `\n                <div class=\"poll-item\">\n                    <h3>${poll.question}</h3>\n                    <p>總票數: ${poll.totalVotes}</p>\n                    <p>截止時間: ${poll.expireTime ? new Date(poll.expireTime).toLocaleString() : '無'}</p>\n                    <p style=\"color: ${isExpired ? 'red' : 'green'};\">${isExpired ? '已過期' : '進行中'}</p>\n                    <button onclick=\"showPollDetail('${poll.id}')\">查看詳細</button>\n                    <button onclick=\"deletePoll('${poll.id}')\">刪除</button>\n                </div>\n            `;\n        }).join('');\n    } catch (error) {\n        console.error('載入投票列表失敗:', error);\n    }\n}\n\n// 顯示投票詳細資訊\nasync function showPollDetail(id) {\n    try {\n        const poll = await api.get(`polls/${id}`);\n        currentPollId = id;\n        \n        document.getElementById('detailQuestion').textContent = poll.question;\n        \n        // 檢查是否已投票或是否過期\n        const voteStatusMessage = document.getElementById('voteStatusMessage');\n        if (poll.expireTime && new Date(poll.expireTime) < new Date()) {\n            voteStatusMessage.textContent = '此投票已過期';\n            voteStatusMessage.style.color = 'red';\n        } else if (poll.votedBrowsers && poll.votedBrowsers.includes(browserId)) {\n            voteStatusMessage.textContent = '您已經投過票了，每人僅能投票一次。';\n            voteStatusMessage.style.color = 'green';\n        } else {\n            voteStatusMessage.textContent = '每人僅能投票一次。';\n            voteStatusMessage.style.color = 'blue';\n        }\n        \n        const optionsContainer = document.getElementById('voteOptions');\n        optionsContainer.innerHTML = poll.options.map(option => `\n            <div class=\"option\">\n                <button ${poll.votedBrowsers && poll.votedBrowsers.includes(browserId) || (poll.expireTime && new Date(poll.expireTime) < new Date()) ? 'disabled' : ''} onclick=\"vote('${id}', '${option.id}')\">投票</button>\n                <span>${option.text}</span>\n            </div>\n        `).join('');\n        \n        document.getElementById('createForm').style.display = 'none';\n        document.getElementById('pollList').style.display = 'none';\n        document.getElementById('pollDetail').style.display = 'block';\n        document.getElementById('resultsContainer').style.display = 'none';\n    } catch (error) {\n        console.error('載入投票詳細資訊失敗:', error);\n    }\n}\n\n// 投票\nasync function vote(pollId, optionId) {\n    try {\n        await api.post(`polls/${pollId}/vote`, { optionId });\n        alert('投票成功！');\n        showPollDetail(pollId);\n    } catch (error) {\n        console.error('投票失敗:', error);\n        if (error.message && error.message.includes('已投票')) {\n            alert('您已經投過票了，每人僅能投票一次。');\n        } else if (error.message && error.message.includes('過期')) {\n            alert('此投票已過期');\n        } else {\n            alert('投票失敗');\n        }\n    }\n}\n\n// 刪除投票\nasync function deletePoll(id) {\n    if (!confirm('確定要刪除這個投票嗎？')) return;\n    \n    try {\n        await api.delete(`polls/${id}`);\n        loadPolls();\n        alert('投票已刪除');\n    } catch (error) {\n        console.error('刪除投票失敗:', error);\n        alert('刪除投票失敗');\n    }\n}\n\n// 顯示結果\nasync function showResults() {\n    if (!currentPollId) return;\n    \n    try {\n        const poll = await api.get(`polls/${currentPollId}`);\n        document.getElementById('resultsQuestion').textContent = poll.question;\n        \n        // 繪製長條圖\n        drawChart(poll.options);\n        \n        document.getElementById('createForm').style.display = 'none';\n        document.getElementById('pollList').style.display = 'none';\n        document.getElementById('pollDetail').style.display = 'none';\n        document.getElementById('resultsContainer').style.display = 'block';\n    } catch (error) {\n        console.error('載入結果失敗:', error);\n    }\n}\n\n// 繪製長條圖\nfunction drawChart(options) {\n    const canvas = document.getElementById('voteChart');\n    const ctx = canvas.getContext('2d');\n    \n    // 清除畫布\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n    \n    // 計算最大票數\n    const maxVotes = Math.max(...options.map(o => o.votes), 1);\n    \n    // 繪製長條圖\n    const barWidth = 30;\n    const spacing = 20;\n    const totalWidth = options.length * (barWidth + spacing);\n    const startX = (canvas.width - totalWidth) / 2;\n    \n    options.forEach((option, index) => {\n        const barHeight = (option.votes / maxVotes) * 150;\n        const x = startX + index * (barWidth + spacing);\n        const y = canvas.height - barHeight - 20;\n        \n        // 繪製長條\n        ctx.fillStyle = '#4CAF50';\n        ctx.fillRect(x, y, barWidth, barHeight);\n        \n        // 繪製選項文字\n        ctx.fillStyle = '#000';\n        ctx.font = '12px Arial';\n        ctx.textAlign = 'center';\n        ctx.fillText(option.text, x + barWidth / 2, canvas.height - 5);\n        \n        // 繪製票數\n        ctx.fillText(`${option.votes} 票`, x + barWidth / 2, y - 5);\n    });\n}\n\n// 初始化頁面\nfunction init() {\n    document.getElementById('showCreateForm').addEventListener('click', showCreateForm);\n    document.getElementById('showPollList').addEventListener('click', showPollList);\n    \n    // 建立投票表單處理\n    const pollForm = document.getElementById('pollForm');\n    pollForm.addEventListener('submit', async (e) => {\n        e.preventDefault();\n        \n        const question = document.getElementById('question').value;\n        const expireTime = document.getElementById('expireTime').value;\n        const options = Array.from(document.querySelectorAll('#optionsContainer input'))\n            .map(input => input.value)\n            .filter(value => value.trim() !== '');\n        \n        if (options.length < 2) {\n            alert('請至少輸入兩個選項');\n            return;\n        }\n        \n        try {\n            await api.post('polls', { question, options, expireTime });\n            alert('投票建立成功！');\n            pollForm.reset();\n            showPollList();\n        } catch (error) {\n            console.error('建立投票失敗:', error);\n            alert('建立投票失敗');\n        }\n    });\n    \n    // 新增選項\n    document.getElementById('addOption').addEventListener('click', () => {\n        const container = document.getElementById('optionsContainer');\n        const optionGroup = document.createElement('div');\n        optionGroup.className = 'option-group';\n        optionGroup.innerHTML = `\n            <input type=\"text\" placeholder=\"選項${container.children.length + 1}\" required>\n            <button type=\"button\" class=\"remove-option\">刪除</button>\n        `;\n        \n        container.appendChild(optionGroup);\n        \n        // 為新加入的刪除按鈕添加事件\n        optionGroup.querySelector('.remove-option').addEventListener('click', () => {\n            optionGroup.remove();\n        });\n    });\n    \n    // 刪除選項按鈕事件處理\n    document.addEventListener('click', (e) => {\n        if (e.target.classList.contains('remove-option')) {\n            e.target.parentElement.remove();\n        }\n    });\n    \n    // 返回列表按鈕\n    document.getElementById('backToList').addEventListener('click', showPollList);\n    \n    // 返回詳細資訊按鈕\n    document.getElementById('backToDetail').addEventListener('click', () => {\n        if (currentPollId) {\n            showPollDetail(currentPollId);\n        }\n    });\n    \n    // 重新整理結果按鈕\n    document.getElementById('refreshResults').addEventListener('click', showResults);\n    \n    // 初始顯示投票列表\n    showPollList();\n}\n\n// 當頁面載入完成後初始化\nwindow.addEventListener('load', init);"
