  handler.py: "import json\nimport uuid\nfrom datetime import datetime\n\n# 記憶體中的投票資料\npolls = {}\n\ndef handle(method, path, body):\n    # 處理API請求\n    if method == \"POST\" and path == \"/polls\":\n        return create_poll(body)\n    elif method == \"GET\" and path == \"/polls\":\n        return get_polls()\n    elif method == \"GET\" and path.startswith(\"/polls/\"):\n        poll_id = path.split(\"/\")[3]\n        return get_poll(poll_id)\n    elif method == \"POST\" and path.startswith(\"/polls/\") and path.endswith(\"/vote\"):\n        poll_id = path.split(\"/\")[3]\n        return vote(poll_id, body)\n    elif method == \"GET\" and path.startswith(\"/polls/\") and path.endswith(\"/results\"):\n        poll_id = path.split(\"/\")[3]\n        return get_results(poll_id)\n    elif method == \"PUT\" and path.startswith(\"/polls/\"):\n        poll_id = path.split(\"/\")[3]\n        return update_poll(poll_id, body)\n    elif method == \"DELETE\" and path.startswith(\"/polls/\"):\n        poll_id = path.split(\"/\")[3]\n        return delete_poll(poll_id)\n    elif method == \"GET\" and path == \"/stats\":\n        return get_stats()\n    else:\n        return 404, {\"error\": \"未找到路由\"}\n\ndef create_poll(body):\n    # 解析請求體\n    data = json.loads(body.decode())\n    question = data.get(\"question\")\n    options = data.get(\"options\", [])\n    expire_time = data.get(\"expireTime\")\n    \n    if not question or len(options) < 2:\n        return 400, {\"error\": \"題目和至少兩個選項是必需的\"}\n    \n    # 建立新的投票\n    poll_id = str(uuid.uuid4())\n    polls[poll_id] = {\n        \"id\": poll_id,\n        \"question\": question,\n        \"options\": [\n            {\"id\": str(uuid.uuid4()), \"text\": option, \"votes\": 0}\n            for option in options\n        ],\n        \"totalVotes\": 0,\n        \"votedBrowsers\": [],\n        \"expireTime\": expire_time\n    }\n    \n    return 201, polls[poll_id]\n\ndef get_polls():\n    # 取得所有投票列表\n    return 200, list(polls.values())\n\ndef get_poll(poll_id):\n    # 取得特定投票詳細資訊\n    poll = polls.get(poll_id)\n    if not poll:\n        return 404, {\"error\": \"找不到投票\"}\n    \n    return 200, poll\n\ndef vote(poll_id, body):\n    # 對特定投票進行投票\n    poll = polls.get(poll_id)\n    if not poll:\n        return 404, {\"error\": \"找不到投票\"}\n    \n    # 檢查是否過期\n    if poll.get(\"expireTime\"):\n        expire_time = datetime.fromisoformat(poll[\"expireTime\"])\n        if datetime.now() > expire_time:\n            return 400, {\"error\": \"此投票已過期\"}\n    \n    data = json.loads(body.decode())\n    option_id = data.get(\"optionId\")\n    \n    if not option_id:\n        return 400, {\"error\": \"選項ID是必需的\"}\n    \n    # 檢查是否已投票\n    if \"votedBrowsers\" not in poll:\n        poll[\"votedBrowsers\"] = []\n    \n    if option_id in poll[\"votedBrowsers\"]:\n        return 400, {\"error\": \"您已經投過票了，每人僅能投票一次。\"}\n    \n    # 找到對應的選項並增加票數\n    for option in poll[\"options\"]:\n        if option[\"id\"] == option_id:\n            option[\"votes\"] += 1\n            poll[\"totalVotes\"] += 1\n            poll[\"votedBrowsers\"].append(option_id)\n            return 200, {\"message\": \"投票成功\"}\n    \n    return 400, {\"error\": \"選項不存在\"}\n\ndef get_results(poll_id):\n    # 取得投票結果\n    poll = polls.get(poll_id)\n    if not poll:\n        return 404, {\"error\": \"找不到投票\"}\n    \n    # 計算百分比\n    total_votes = poll.get(\"totalVotes\", 0)\n    for option in poll[\"options\"]:\n        if total_votes > 0:\n            option[\"percentage\"] = round((option[\"votes\"] / total_votes) * 100, 2)\n        else:\n            option[\"percentage\"] = 0\n    \n    return 200, poll\n\ndef update_poll(poll_id, body):\n    # 更新投票\n    poll = polls.get(poll_id)\n    if not poll:\n        return 404, {\"error\": \"找不到投票\"}\n    \n    data = json.loads(body.decode())\n    question = data.get(\"question\")\n    options = data.get(\"options\")\n    expire_time = data.get(\"expireTime\")\n    \n    if question:\n        poll[\"question\"] = question\n    \n    if options is not None:\n        # 更新選項\n        updated_options = []\n        for option in options:\n            if isinstance(option, dict) and \"id\" in option:\n                # 已存在的選項\n                existing_option = next((opt for opt in poll[\"options\"] if opt[\"id\"] == option[\"id\"]), None)\n                if existing_option:\n                    existing_option[\"text\"] = option[\"text\"]\n                    updated_options.append(existing_option)\n            else:\n                # 新增選項\n                updated_options.append({\"id\": str(uuid.uuid4()), \"text\": option, \"votes\": 0})\n        \n        poll[\"options\"] = updated_options\n    \n    if expire_time is not None:\n        poll[\"expireTime\"] = expire_time\n    \n    return 200, poll\n\ndef delete_poll(poll_id):\n    # 刪除投票\n    if poll_id in polls:\n        del polls[poll_id]\n        return 200, {\"message\": \"投票已刪除\"}\n    else:\n        return 404, {\"error\": \"找不到投票\"}\n\ndef get_stats():\n    # 取得系統統計資訊\n    total_polls = len(polls)\n    total_votes = sum(poll[\"totalVotes\"] for poll in polls.values())\n    \n    return 200, {\n        \"totalPolls\": total_polls,\n        \"totalVotes\": total_votes\n    }"
