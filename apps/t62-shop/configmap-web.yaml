= 'none';\n    } catch (error) {\n      alert(`提交訂單失敗: ${error.message}`);\n    }\n  }\n\n  // 初始化\n  showPage('menu');\n  loadMenu();\n\n  // 為頁面切換按鈕添加事件監聽器\n  document.getElementById('menu-tab').addEventListener('click', () => showPage('menu'));\n  document.getElementById('cart-tab').addEventListener('click', () => showPage('cart'));\n  document.getElementById('order-tab').addEventListener('click', () => showPage('order'));\n\n  // 為結帳按鈕添加事件監聽器\n  checkoutBtn.addEventListener('click', () => {\n    if (cart.length === 0) {\n      alert('購物車是空的');\n      return;\n    }\n    orderModal.style.display = 'block';\n  });\n\n  // 為模態框關閉按鈕添加事件監聽器\n  closeModal.addEventListener('click', () => {\n    orderModal.style.display = 'none';\n  });\n\n  // 點擊模態框背景關閉\n  window.addEventListener('click', (e) => {\n    if (e.target === orderModal) {\n      orderModal.style.display = 'none';\n    }\n  });\n\n  // 為訂單表單添加事件監聽器\n  orderForm.addEventListener('submit', (e) => {\n    e.preventDefault();\n    const customerName = document.getElementById('customer-name').value;\n    const phone = document.getElementById('phone').value;\n    const address = document.getElementById('address').value;\n    submitOrder(customerName, phone, address);\n  });\n});"
