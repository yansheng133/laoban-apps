" alt=\"${item.name}\">\n        <h3>${item.name}</h3>\n        <p>$${item.price}</p>\n        <button class=\"add-to-cart-btn\" data-id=\"${item.id}\">加入購物車</button>\n      `;\n      menuItemsContainer.appendChild(itemElement);\n    });\n\n    // 為加入購物車按鈕添加事件監聽器\n    document.querySelectorAll('.add-to-cart-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const itemId = e.target.dataset.id;\n        addToCart(itemId);\n      });\n    });\n  }\n\n  // 加入購物車\n  async function addToCart(itemId) {\n    try {\n      const response = await fetch('api/cart/add', {\n        method: 'POST',\n        headers: {\n          'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({ item_id: itemId, quantity: 1 })\n      });\n\n      if (!response.ok) {\n        throw new Error(await response.text());\n      }\n\n      const data = await response.json();\n      cart = data.cart;\n      loadCart();\n    } catch (error) {\n      alert(`加入購物車失敗: ${error.message}`);\n    }\n  }\n\n  // 獲取購物車數據\n  async function loadCart() {\n    try {\n      const response = await fetch('api/cart/add');\n      if (!response.ok) {\n        throw new Error(await response.text());\n      }\n      const data = await response.json();\n      displayCart(data.cart);\n    } catch (error) {\n      alert(`獲取購物車失敗: ${error.message}`);\n    }\n  }\n\n  // 顯示購物車\n  function displayCart(items) {\n    cartItemsContainer.innerHTML = '';\n    let total = 0;\n\n    if (items.length === 0) {\n      cartItemsContainer.innerHTML = '<p>購物車是空的</p>';\n      cartTotalElement.textContent = '總計: $0';\n      return;\n    }\n\n    items.forEach(item => {\n      const itemElement = document.createElement('div');\n      itemElement.className = 'cart-item';\n      total += item.price * item.quantity;\n      itemElement.innerHTML = `\n        <span>${item.name} - $${item.price} x ${item.quantity}</span>\n        <div>\n          <button class=\"update-quantity-btn\" data-id=\"${item.id}\" data-action=\"decrease\">-</button>\n          <button class=\"update-quantity-btn\" data-id=\"${item.id}\" data-action=\"increase\">+</button>\n          <button class=\"remove-item-btn\" data-id=\"${item.id}\">刪除</button>\n        </div>\n      `;\n      cartItemsContainer.appendChild(itemElement);\n    });\n\n    cartTotalElement.textContent = `總計: $${total}`;\n\n    // 為更新數量按鈕添加事件監聽器\n    document.querySelectorAll('.update-quantity-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const itemId = e.target.dataset.id;\n        const action = e.target.dataset.action;\n        updateCartQuantity(itemId, action);\n      });\n    });\n\n    // 為刪除按鈕添加事件監聽器\n    document.querySelectorAll('.remove-item-btn').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        const itemId = e.target.dataset.id;\n        removeFromCart(itemId);\n      });\n    });\n  }\n\n  // 更新購物車數量\n  async function updateCartQuantity(itemId, action) {\n    try {\n      let quantity;\n      if (action === 'increase') {\n        quantity = 1;\n      } else if (action === 'decrease') {\n        quantity = -1;\n      }\n\n      const response = await fetch('api/cart/update', {\n        method: 'PUT',\n        headers: {\n          'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({ item_id: itemId, quantity })\n      });\n\n      if (!response.ok) {\n        throw new Error(await response.text());\n      }\n\n      const data = await response.json();\n      cart = data.cart;\n      loadCart();\n    } catch (error) {\n      alert(`更新購物車失敗: ${error.message}`);\n    }\n  }\n\n  // 從購物車刪除商品\n  async function removeFromCart(itemId) {\n    try {\n      const response = await fetch('api/cart/remove', {\n        method: 'DELETE',\n        headers: {\n          'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({ item_id: itemId })\n      });\n\n      if (!response.ok) {\n        throw new Error(await respon