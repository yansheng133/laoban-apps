  server.py: |
    """laoban web server (fixed template, not generated by AI).

    Serves the three static files mounted from the ConfigMap and forwards
    every request under api/ to the API service, stripping the api/ prefix.
    The page is opened through the Rancher service proxy, which removes the
    proxy prefix before the request reaches this server, so the page itself
    must use relative URLs only. Python standard library only.

    Environment:
      LAOBAN_STATIC_DIR  directory holding the static files (default /app)
      LAOBAN_API_URL     base URL of the API service, e.g. http://demo-api:8080/
      PORT               listen port (default 8080; 0 picks a free port)
    """

    import http.server
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    STATIC_DIR = os.environ.get("LAOBAN_STATIC_DIR", "/app")
    API_URL = os.environ.get("LAOBAN_API_URL", "")
    PORT = int(os.environ.get("PORT", "8080"))
    MAX_BODY = 1024 * 1024
    TIMEOUT_SECONDS = 30

    # Only these files are served; server.py itself is not.
    FILES = {
        "index.html": "text/html; charset=utf-8",
        "app.js": "text/javascript; charset=utf-8",
        "style.css": "text/css; charset=utf-8",
    }

    # Never use a proxy from the environment for the in-cluster API call.
    OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}))


    class Handler(http.server.BaseHTTPRequestHandler):
        server_version = "laoban-web"
        sys_version = ""
        protocol_version = "HTTP/1.0"

        def _send(self, status, body, content_type):
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("X-Content-Type-Options", "nosniff")
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(body)

        def _text(self, status, message):
            self._send(status, (message + "\n").encode("utf-8"), "text/plain; charset=utf-8")

        def _route(self):
            path = urllib.parse.urlsplit(self.path).path
            if path == "/api" or path.startswith("/api/"):
                self._proxy(path)
                return
            if self.command not in ("GET", "HEAD"):
                self._text(405, "method not allowed")
                return
            name = path.lstrip("/") or "index.html"
            content_type = FILES.get(name)
            if content_type is None:
                self._text(404, "not found")
                return
            try:
                with open(os.path.join(STATIC_DIR, name), "rb") as f:
                    body = f.read()
            except OSError:
                self._text(404, "not found")
                return
            self._send(200, body, content_type)

        def _proxy(self, path):
            if not API_URL:
                self._text(502, "api not configured")
                return
            try:
                length = int(self.headers.get("Content-Length") or 0)
            except ValueError:
                self._text(400, "bad content-length")
                return
            if length < 0 or length > MAX_BODY:
                self._text(413, "request body too large")
                return
            body = self.rfile.read(length) if length else None

            rest = path[len("/api"):].lstrip("/")
            target = API_URL.rstrip("/") + "/" + rest
            query = urllib.parse.urlsplit(self.path).query
            if query:
                target += "?" + query
            headers = {}
            for name in ("Content-Type", "Accept"):
                value = self.headers.get(name)
                if value:
                    headers[name] = value
            request = urllib.request.Request(target, data=body, method=self.command, headers=headers)
            try:
                with OPENER.open(request, timeout=TIMEOUT_SECONDS) as resp:
                    status = resp.status
                    content_type = resp.headers.get("Content-Type", "application/json")
                    data = resp.read(MAX_BODY)
            except urllib.error.HTTPError as err:
                status = err.code
                content_type = err.headers.get("Content-Type", "application/json")
                data = err.read(MAX_BODY)
            except (urllib.error.URLError, OSError):
                self._send(502, b'{"error":"api unavailable"}', "application/json")
                return
            self._send(status, data, content_type)

        do_GET = _route
        do_HEAD = _route
        do_POST = _route
        do_PUT = _route
        do_PATCH = _route
        do_DELETE = _route


    def main():
        server = http.server.ThreadingHTTPServer(("", PORT), Handler)
        server.daemon_threads = True
        print("laoban-web listening on port %d" % server.server_address[1], file=sys.stderr, flush=True)
        server.serve_forever()


    if __name__ == "__main__":
        main()
  style.css: |
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #faf6ef;
      color: #2d2a26;
    }
    header {
      background: #7a4a21;
      color: #fff;
      padding: 12px 16px 0;
    }
    header h1 { margin: 0 0 10px; font-size: 1.4rem; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab {
      border: 0;
      background: #9a6335;
      color: #fff;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
    }
    .tab.active { background: #faf6ef; color: #7a4a21; font-weight: 700; }
    main { max-width: 1000px; margin: 0 auto; padding: 16px; }
    .panel.hidden, .hidden { display: none; }
    h2 { margin-top: 0; }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }
    .card {
      background: #fff;
      border: 2px solid #e6dccb;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card.selected { border-color: #7a4a21; background: #fff8ec; }
    .card-name { font-weight: 700; font-size: 1.05rem; }
    .card-price { color: #6b6256; }
    .qty { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .qty-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #7a4a21;
      background: #fff;
      color: #7a4a21;
      font-size: 1.4rem;
      cursor: pointer;
    }
    .qty-btn:active { background: #f1e3cf; }
    .qty-count { min-width: 28px; text-align: center; font-size: 1.2rem; font-weight: 700; }
    .order-bar {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #e6dccb;
      border-radius: 10px;
      padding: 12px;
    }
    .order-bar input, .toolbar select {
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #c9bda9;
      border-radius: 6px;
    }
    .order-bar input { width: 110px; }
    .total { margin-left: auto; font-size: 1.2rem; }
    button.primary {
      background: #7a4a21;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
    button.primary:disabled { opacity: 0.6; cursor: default; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar button {
      padding: 10px 16px;
      font-size: 1rem;
      border: 1px solid #7a4a21;
      background: #fff;
      color: #7a4a21;
      border-radius: 6px;
      cursor: pointer;
    }
    .message { min-height: 1.4em; margin: 10px 0 0; }
    .message.ok { color: #1e7a3a; font-weight: 600; }
    .message.error { color: #b3261e; font-weight: 600; }
    .orders {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .empty { color: #6b6256; }
    .order {
      background: #fff;
      border: 1px solid #e6dccb;
      border-left: 8px solid #999;
      border-radius: 10px;
      padding: 12px;
    }
    .order.status-todo { border-left-color: #e8590c; }
    .order.status-cooking { border-left-color: #f2b705; }
    .order.status-done { border-left-color: #2f9e44; }
    .order-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .order-title { font-weight: 700; }
    .order-time { color: #6b6256; font-size: 0.9rem; margin: 4px 0; }
    .order-items { margin: 8px 0; padding-left: 20px; }
    .order-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .order-total { font-weight: 700; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }
    .badge-todo { background: #e8590c; }
    .badge-cooking { background: #f2b705; color: #3a2f00; }
    .badge-done { background: #2f9e44; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat {
      flex: 1 1 200px;
      background: #fff;
      border: 1px solid #e6dccb;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-label { color: #6b6256; }
    .stat-value { font-size: 2.2rem; font-weight: 700; color: #7a4a21; }
    @media (max-width: 520px) {
      main { padding: 12px; }
      .total { margin-left: 0; width: 100%; }
      .order-bar button.primary { width: 100%; }
      .tab { flex: 1; padding: 12px 8px; }
    }
