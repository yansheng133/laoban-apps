        'Content-Type': 'application/json'\n                },\n                body: JSON.stringify({ content })\n            });\n            \n            if (response.ok) {\n                messageInput.value = '';\n                loadMessages(); // 重新載入留言\n            } else {\n                console.error('新增留言失敗');\n            }\n        } catch (error) {\n            console.error('網路錯誤:', error);\n        }\n    });\n\n    // 按讚功能\n    window.likeMessage = async (id) => {\n        try {\n            const response = await fetch(`api/messages/${id}/like`, {\n                method: 'PUT'\n            });\n            \n            if (response.ok) {\n                loadMessages(); // 重新載入留言\n            } else {\n                console.error('按讚失敗');\n            }\n        } catch (error) {\n            console.error('網路錯誤:', error);\n        }\n    };\n\n    // 刪除留言\n    window.deleteMessage = async (id) => {\n        if (!confirm('確定要刪除這則留言嗎？')) return;\n        \n        try {\n            const response = await fetch(`api/messages/${id}`, {\n                method: 'DELETE'\n            });\n            \n            if (response.ok) {\n                loadMessages(); // 重新載入留言\n            } else {\n                console.error('刪除留言失敗');\n            }\n        } catch (error) {\n            console.error('網路錯誤:', error);\n        }\n    };\n\n    // 頁面載入時獲取留言\n    loadMessages();\n});"
