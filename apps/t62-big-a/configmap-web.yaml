  app.js: |
    (function () {
      'use strict';

      var STATUS_LABEL = { pending: '待做', preparing: '製作中', done: '完成' };
      var STATUS_ORDER = ['pending', 'preparing', 'done'];
      var DINE_LABEL = { dine_in: '內用', takeout: '外帶' };

      var menu = [];
      var cart = {}; // menu_item_id -> quantity
      var currentTab = 'order';
      var pollTimer = null;
      var messageTimer = null;

      function $(id) { return document.getElementById(id); }

      function showMessage(text, kind) {
        var el = $('message');
        el.textContent = text;
        el.className = 'message ' + (kind || 'info');
        if (messageTimer) { clearTimeout(messageTimer); }
        if (kind !== 'error') {
          messageTimer = setTimeout(function () { el.className = 'message hidden'; }, 4000);
        }
      }

      function clearMessage() {
        $('message').className = 'message hidden';
      }

      // ---- API 呼叫 ----
      function api(method, path, body) {
        var opts = { method: method, headers: {} };
        if (body !== undefined) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(body);
        }
        return fetch('api/' + path, opts).then(function (res) {
          return res.text().then(function (text) {
            var data = null;
            if (text) {
              try { data = JSON.parse(text); } catch (e) { data = null; }
            }
            if (!res.ok) {
              var msg = data && data.error ? data.error : ('請求失敗（狀態碼 ' + res.status + '）');
              throw new Error(msg);
            }
            if (data === null) { throw new Error('伺服器回應格式錯誤'); }
            return data;
          });
        }, function () {
          throw new Error('無法連線到伺服器，請稍後再試');
        });
      }

      // ---- 分頁切換 ----
      function switchTab(name) {
        currentTab = name;
        var tabs = document.querySelectorAll('.tab');
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === name);
        }
        ['order', 'kitchen', 'revenue'].forEach(function (t) {
          $('tab-' + t).classList.toggle('hidden', t !== name);
        });
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        if (name === 'kitchen') {
          loadOrders();
          pollTimer = setInterval(loadOrders, 5000);
        } else if (name === 'revenue') {
          loadRevenue();
        } else {
          loadMenu();
        }
      }

      // ---- 點餐 ----
      function loadMenu() {
        return api('GET', 'menu').then(function (data) {
          menu = data.items || [];
          renderMenu();
          renderCart();
        }).catch(function (e) {
          showMessage('載入菜單失敗：' + e.message, 'error');
        });
      }

      function renderMenu() {
        var ul = $('menu-list');
        ul.innerHTML = '';
        if (!menu.length) {
          var li = document.createElement('li');
          li.className = 'empty';
          li.textContent = '目前沒有餐點';
          ul.appendChild(li);
          return;
        }
        menu.forEach(function (m) {
          var li = document.createElement('li');
          li.className = 'menu-item';
          var info = document.createElement('div');
          info.className = 'item-info';
          var name = document.createElement('span');
          name.className = 'item-name';
          name.textContent = m.name;
          var price = document.createElement('span');
          price.className = 'item-price';
          price.textContent = m.price + ' 元';
          info.appendChild(name);
          info.appendChild(price);

          var qty = document.createElement('div');
          qty.className = 'qty';
          var minus = document.createElement('button');
          minus.type = 'button';
          minus.className = 'qty-btn';
          minus.textContent = '−';
          minus.setAttribute('aria-label', '減少 ' + m.name);
          minus.addEventListener('click', function () { changeQty(m.id, -1); });
          var count = document.createElement('span');
          count.className = 'qty-count';
          count.textContent = String(cart[m.id] || 0);
          var plus = document.createElement('button');
          plus.type = 'button';
          plus.className = 'qty-btn';
          plus.textContent = '+';
          plus.setAttribute('aria-label', '增加 ' + m.name);
          plus.addEventListener('click', function () { changeQty(m.id, 1); });
          qty.appendChild(minus);
          qty.appendChild(count);
          qty.appendChild(plus);

          li.appendChild(info);
          li.appendChild(qty);
          ul.appendChild(li);
        });
      }

      function changeQty(id, delta) {
        var q = (cart[id] || 0) + delta;
        if (q < 0) { q = 0; }
        if (q > 99) { q = 99; }
        if (q === 0) { delete cart[id]; } else { cart[id] = q; }
        renderMenu();
        renderCart();
      }

      function cartLines() {
        var lines = [];
        menu.forEach(function (m) {
          var q = cart[m.id];
          if (q > 0) { lines.push({ item: m, quantity: q }); }
        });
        return lines;
      }

      function renderCart() {
        var ul = $('cart-list');
        ul.innerHTML = '';
        var lines = cartLines();
        var total = 0;
        if (!lines.length) {
          var li = document.createElement('li');
          li.className = 'empty';
          li.textContent = '尚未選擇餐點';
          ul.appendChild(li);
        }
        lines.forEach(function (l) {
          var sub = l.item.price * l.quantity;
          total += sub;
          var li = document.createElement('li');
          li.className = 'cart-line';
          var a = document.createElement('span');
          a.textContent = l.item.name + ' × ' + l.quantity;
          var b = document.createElement('span');
          b.textContent = sub + ' 元';
          li.appendChild(a);
          li.appendChild(b);
          ul.appendChild(li);
        });
        $('cart-total').textContent = String(total);
      }

      function updateTableField() {
        var dine = document.querySelector('input[name="dine_type"]:checked').value;
        $('table-label').classList.toggle('hidden', dine !== 'dine_in');
      }

      function submitOrder(ev) {
        ev.preventDefault();
        var lines = cartLines();
        if (!lines.length) {
          showMessage('請先選擇至少一項餐點', 'error');
          return;
        }
        var dine = document.querySelector('input[name="dine_type"]:checked').value;
        var table = $('table-no').value.trim();
        if (dine === 'dine_in' && !table) {
          showMessage('內用請填寫桌號', 'error');
          $('table-no').focus();
          return;
        }
        if (dine === 'takeout') { table = ''; }
        var payload = {
          items: lines.map(function (l) {
            return { menu_item_id: l.item.id, quantity: l.quantity };
          }),
          dine_type: dine,
          table_no: table
        };
        var btn = $('submit-order');
        btn.disabled = true;
        api('POST', 'orders', payload).then(function (order) {
          cart = {};
          $('table-no').value = '';
          renderMenu();
          renderCart();
          showMessage('訂單已送出（編號 ' + order.id + '，總計 ' + order.total + ' 元）', 'success');
        }).catch(function (e) {
          showMessage('送出訂單失敗：' + e.message, 'error');
        }).then(function () {
          btn.disabled = false;
        });
      }

      // ---- 廚房 ----
      function formatTime(s) {
        if (!s) { return ''; }
        return String(s).replace('T', ' ').slice(0, 19);
      }

      function loadOrders() {
        return api('GET', 'orders').then(function (data) {
          if (currentTab === 'kitchen') { clearErrorIfAny(); }
          renderOrders(data.items || []);
        }).catch(function (e) {
          showMessage('載入訂單失敗：' + e.message, 'error');
        });
      }

      function clearErrorIfAny() {
        var el = $('message');
        if (el.classList.contains('error')) { clearMessage(); }
      }

      function renderOrders(orders) {
        var box = $('orders-list');
        box.innerHTML = '';
        if (!orders.length) {
          var p = document.createElement('p');
          p.className = 'empty';
          p.textContent = '目前沒有訂單';
          box.appendChild(p);
          return;
        }
        orders.forEach(function (o) {
          var card = document.createElement('article');
          card.className = 'order-card status-' + o.status;

          var head = document.createElement('div');
          head.className = 'order-head';
          var title = document.createElement('strong');
          var where = o.dine_type === 'dine_in' ? ('內用 ' + (o.table_no || '')) : '外帶';
          title.textContent = '#' + o.id + '　' + where;
          var badge = document.createElement('span');
          badge.className = 'badge badge-' + o.status;
          badge.textContent = STATUS_LABEL[o.status] || o.status;
          head.appendChild(title);
          head.appendChild(badge);
          card.appendChild(head);

          var time = document.createElement('div');
          time.className = 'order-time';
          time.textContent = formatTime(o.created_at);
          card.appendChild(time);

          var ul = document.createElement('ul');
          ul.className = 'order-items';
          (o.items || []).forEach(function (it) {
            var li = document.createElement('li');
            li.textContent = it.name + ' × ' + it.quantity;
            ul.appendChild(li);
          });
          card.appendChild(ul);

          var total = document.createElement('div');
          total.className = 'order-total';
          total.textContent = '合計 ' + o.total + ' 元';
          card.appendChild(total);

          var actions = document.createElement('div');
          actions.className = 'order-actions';
          STATUS_ORDER.forEach(function (s) {
            var b = document.createElement('button');
            b.type = 'button';
            b.textContent = STATUS_LABEL[s];
            if (s === o.status) {
              b.disabled = true;
              b.classList.add('current');
            }
            b.addEventListener('click', function () { setStatus(o.id, s); });
            actions.appendChild(b);
          });
          card.appendChild(actions);

          box.appendChild(card);
        });
      }

      function setStatus(orderId, status) {
        api('PATCH', 'orders/status', { order_id: orderId, status: status }).then(function () {
          return loadOrders();
        }).catch(function (e) {
          showMessage('更新狀態失敗：' + e.message, 'error');
        });
      }

      // ---- 營業額 ----
      function loadRevenue() {
        return api('GET', 'revenue/today').then(function (data) {
          $('rev-count').textContent = String(data.order_count);
          $('rev-total').textContent = data.total_amount + ' 元';
          var ol = $('rev-top');
          ol.innerHTML = '';
          var top = data.top_items || [];
          if (!top.length) {
            var li = document.createElement('li');
            li.className = 'empty';
            li.textContent = '今天還沒有銷售紀錄';
            ol.appendChild(li);
          }
          top.forEach(function (t) {
            var li = document.createElement('li');
            li.textContent = t.name + '：' + t.quantity + ' 份';
            ol.appendChild(li);
          });
        }).catch(function (e) {
          showMessage('載入營業額失敗：' + e.message, 'error');
        });
      }

      // ---- 初始化 ----
      function init() {
        var tabs = document.querySelectorAll('.tab');
        for (var i = 0; i < tabs.length; i++) {
          (function (t) {
            t.addEventListener('click', function () {
              clearMessage();
              switchTab(t.getAttribute('data-tab'));
            });
          })(tabs[i]);
        }
        var radios = document.querySelectorAll('input[name="dine_type"]');
        for (var j = 0; j < radios.length; j++) {
          radios[j].addEventListener('change', updateTableField);
        }
        $('order-form').addEventListener('submit', submitOrder);
        $('refresh-orders').addEventListener('click', loadOrders);
        $('refresh-revenue').addEventListener('click', loadRevenue);
        updateTableField();
        switchTab('order');
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
