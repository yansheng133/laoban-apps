  app.js: "const noteForm = document.getElementById('noteForm');\nconst noteIdInput = document.getElementById('noteId');\nconst noteTitleInput = document.getElementById('noteTitle');\nconst noteContentInput = document.getElementById('noteContent');\nconst cancelEditBtn = document.getElementById('cancelEdit');\nconst searchInput = document.getElementById('searchInput');\nconst filterSelect = document.getElementById('filterSelect');\nconst notesList = document.getElementById('notesList');\n\nlet notes = [];\n\n// 初始化應用程式\nasync function init() {\n    await loadNotes();\n    setupEventListeners();\n}\n\n// 載入筆記列表\nasync function loadNotes() {\n    try {\n        const response = await fetch('api/notes');\n        if (response.ok) {\n            notes = await response.json();\n            renderNotes(notes);\n        } else {\n            console.error('無法載入筆記:', response.status);\n        }\n    } catch (error) {\n        console.error('錯誤:', error);\n    }\n}\n\n// 渲染筆記列表\nfunction renderNotes(notesToRender) {\n    notesList.innerHTML = '';\n\n    if (notesToRender.length === 0) {\n        notesList.innerHTML = '<p class=\"no-notes\">目前沒有筆記</p>';\n        return;\n    }\n\n    const notesContainer = document.createElement('div');\n    notesContainer.className = 'notes-container';\n\n    notesToRender.forEach(note => {\n        const noteElement = document.createElement('div');\n        noteElement.className = 'note-item';\n        noteElement.innerHTML = `\n            <h3>${escapeHtml(note.title)}</h3>\n            <p class=\"content-preview\">${escapeHtml(note.content.substring(0, 100))}${note.content.length > 100 ? '...' : ''}</p>\n            <p class=\"timestamp\">更新時間: ${new Date(note.updatedAt).toLocaleString('zh-TW')}</p>\n            <div class=\"note-actions\">\n                <button onclick=\"editNote('${note.id}')\">編輯</button>\n                <button onclick=\"deleteNote('${note.id}')\">刪除</button>\n            </div>\n        `;\n        notesContainer.appendChild(noteElement);\n    });\n\n    notesList.appendChild(notesContainer);\n}\n\n// 搜尋和篩選筆記\nfunction filterNotes() {\n    const searchTerm = searchInput.value.toLowerCase();\n    const filterType = filterSelect.value;\n\n    let filteredNotes = notes.filter(note => \n        note.title.toLowerCase().includes(searchTerm) || \n        note.content.toLowerCase().includes(searchTerm)\n    );\n\n    switch (filterType) {\n        case 'recent':\n            filteredNotes.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));\n            break;\n        case 'oldest':\n            filteredNotes.sort((a, b) => new Date(a.updatedAt) - new Date(b.updatedAt));\n            break;\n    }\n\n    renderNotes(filteredNotes);\n}\n\n// 新增筆記\nasync function createNote() {\n    const title = noteTitleInput.value.trim();\n    const content = noteContentInput.value.trim();\n\n    if (!title || !content) {\n        alert('請填寫標題和內容');\n        return;\n    }\n\n    try {\n        const response = await fetch('api/notes', {\n            method: 'POST',\n            headers: {\n                'Content-Type': 'application/json'\n            },\n            body: JSON.stringify({ title, content })\n        });\n\n        if (response.ok) {\n            const newNote = await response.json();\n            notes.push(newNote);\n            resetForm();\n            renderNotes(notes);\n        } else {\n            console.error('新增筆記失敗:', response.status);\n        }\n    } catch (error) {\n        console.error('錯誤:', error);\n    }\n}\n\n// 編輯筆記\nasync function editNote(id) {\n    const note = notes.find(n => n.id === id);\n    if (!note) return;\n\n    noteIdInput.value = note.id;\n    noteTitleInput.value = note.title;\n    noteContentInput.value = note.content;\n\n    noteForm.onsubmit = function(e) {\n        e.preventDefault();\n        updateNote(id);\n    };\n\n    cancelEditBtn.style.display = 'inline-block';\n}\n\n// 更新筆記\nasync function updateNote(id) {\n    const title = noteTitleInput.value.trim();\n    const content = noteContentInput.value.trim();\n\n    if (!title || !content) {\n        alert('請填寫標題和內容');\n        return;\n    }\n\n    try {\n        const response = await fetch(`api/notes/${id}`, {\n            method: 'PUT',\n            headers: {\n                'Content-Type': 'application/json'\n            },\n            body: JSON.stringify({ title, content })\n        });\n\n        if (response.ok) {\n            const updatedNote = await response.json();\n            const index = notes.findIndex(n => n.id === id);\n            if (index !== -1) {\n                notes[index] = updatedNote;\n                resetForm();\n                renderNotes(notes);\n            }\n        } else {\n            console.error('更新筆記失敗:', response.status);\n        }\n    } catch (error) {\n        console.error('錯誤:', error);\n    }\n}\n\n// 刪除筆記\nasync function deleteNote(id) {\n    if (!confirm('確定要刪除這筆筆記嗎？')) return;\n\n    try {\n        const response = await fetch(`api/notes/${id}`, {\n            method: 'DELETE'\n        });\n\n        if (response.ok) {\n            notes = notes.filter(note => note.id !== id);\n            renderNotes(notes);\n        } else {\n            console.error('刪除筆記失敗:', response.status);\n        }\n    } catch (error) {\n        console.error('錯誤:', error);\n    }\n}\n\n// 重置表單\nfunction resetForm() {\n    noteIdInput.value = '';\n    noteTitleInput.value = '';\n    noteContentInput.value = '';\n    noteForm.onsubmit = function(e) {\n        e.preventDefault();\n        createNote();\n    };\n    cancelEditBtn.style.display = 'none';\n}\n\n// 取消編輯\nfunction cancelEdit() {\n    resetForm();\n}\n\n// HTML轉義函數\nfunction escapeHtml(text) {\n    const div = document.createElement('div');\n    div.textContent = text;\n    return div.innerHTML;\n}\n\n// 設定事件監聽器\nfunction setupEventListeners() {\n    noteForm.onsubmit = function(e) {\n        e.preventDefault();\n        createNote();\n    };\n\n    cancelEditBtn.onclick = cancelEdit;\n\n    searchInput.addEventListener('input', filterNotes);\n    filterSelect.addEventListener('change', filterNotes);\n}\n\n// 初始化應用程式\ninit();"
