 {\n    background-color: #fff;\n    padding: 20px;\n    border-radius: 8px;\n    box-shadow: 0 2px 5px rgba(0,0,0,0.1);\n    transition: transform 0.2s;\n}\n\n.note-item:hover {\n    transform: translateY(-2px);\n    box-shadow: 0 4px 8px rgba(0,0,0,0.15);\n}\n\n.note-item h3 {\n    color: #2c3e50;\n    margin-bottom: 10px;\n    font-size: 1.2em;\n}\n\n.content-preview {\n    color: #555;\n    margin-bottom: 10px;\n    line-height: 1.4;\n}\n\n.timestamp {\n    color: #7f8c8d;\n    font-size: 0.9em;\n    margin-bottom: 15px;\n}\n\n.note-actions {\n    display: flex;\n    gap: 10px;\n}\n\n.note-actions button {\n    padding: 8px 12px;\n    border: none;\n    border-radius: 4px;\n    cursor: pointer;\n    font-size: 14px;\n}\n\n.note-actions button:first-child {\n    background-color: #f39c12;\n    color: white;\n}\n\n.note-actions button:last-child {\n    background-color: #e74c3c;\n    color: white;\n}\n\n.no-notes {\n    text-align: center;\n    padding: 40px;\n    background-color: #fff;\n    border-radius: 8px;\n    box-shadow: 0 2px 5px rgba(0,0,0,0.1);\n    color: #7f8c8d;\n}\n\n/* 响应式設計 */\n@media (max-width: 600px) {\n    .container {\n        padding: 10px;\n    }\n\n    .search-section {\n        flex-direction: column;\n    }\n\n    .note-actions {\n        flex-direction: column;\n    }\n\n    .note-item {\n        padding: 15px;\n    }\n}"
