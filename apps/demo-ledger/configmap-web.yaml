  app.js: "document.addEventListener('DOMContentLoaded', () => {\n    const form = document.getElementById('transactionForm');\n    const transactionList = document.getElementById('transactionList');\n    const currentBalance = document.getElementById('currentBalance');\n\n    // 重新整理畫面\n    function refresh() {\n        fetch('api/transactions')\n            .then(response => response.json())\n            .then(data => {\n                renderTransactions(data);\n            });\n        \n        fetch('api/balance')\n            .then(response => response.json())\n            .then(data => {\n                currentBalance.textContent = data.balance.toFixed(2);\n            });\n    }\n\n    // 渲染交易紀錄\n    function renderTransactions(transactions) {\n        transactionList.innerHTML = '';\n        transactions.forEach(transaction => {\n            const li = document.createElement('li');\n            li.className = transaction.type === 'income' ? 'income' : 'expense';\n            li.textContent = `${transaction.description}: ${transaction.type === 'income' ? '+' : '-'}$${transaction.amount.toFixed(2)}`;\n            transactionList.appendChild(li);\n        });\n    }\n\n    // 處理表單提交\n    form.addEventListener('submit', (e) => {\n        e.preventDefault();\n        \n        const description = document.getElementById('description').value;\n        const amount = parseFloat(document.getElementById('amount').value);\n        const type = document.getElementById('type').value;\n        \n        fetch('api/transactions', {\n            method: 'POST',\n            headers: {\n                'Content-Type': 'application/json'\n            },\n            body: JSON.stringify({\n                description: description,\n                amount: amount,\n                type: type\n            })\n        })\n        .then(() => {\n            form.reset();\n            refresh();\n        });\n    });\n\n    // 初始載入\n    refresh();\n});"
