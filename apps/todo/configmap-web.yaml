  app.js: "document.addEventListener('DOMContentLoaded', () => {\n    const form = document.getElementById('todo-form');\n    const input = document.getElementById('todo-input');\n    const dueDateInput = document.getElementById('due-date');\n    const list = document.getElementById('todo-list');\n\n    // 獲取待辦事項列表\n    async function fetchTodos() {\n        try {\n            const response = await fetch('api/todos');\n            const todos = await response.json();\n            renderTodos(todos);\n        } catch (error) {\n            console.error('獲取待辦事項時出錯:', error);\n        }\n    }\n\n    // 渲染待辦事項列表\n    function renderTodos(todos) {\n        list.innerHTML = '';\n        todos.forEach(todo => {\n            const li = document.createElement('li');\n            \n            // 檢查是否過期\n            const isOverdue = todo.due_date && new Date(todo.due_date) < new Date() && !todo.completed;\n            \n            li.innerHTML = `\n                <span class=\"${todo.completed ? 'completed' : ''} ${isOverdue ? 'overdue' : ''}\">${todo.text}</span>\n                <div>\n                    <small>${todo.due_date || '無到期日'}</small>\n                    <button class=\"complete-btn\" data-id=\"${todo.id}\">\n                        ${todo.completed ? '取消完成' : '標記完成'}\n                    </button>\n                    <button class=\"delete-btn\" data-id=\"${todo.id}\">刪除</button>\n                </div>\n            `;\n            list.appendChild(li);\n        });\n    }\n\n    // 新增待辦事項\n    form.addEventListener('submit', async (e) => {\n        e.preventDefault();\n        const text = input.value.trim();\n        const dueDate = dueDateInput.value;\n        \n        if (text) {\n            try {\n                await fetch('api/todos', {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'application/json' },\n                    body: JSON.stringify({ text, due_date: dueDate || null })\n                });\n                input.value = '';\n                dueDateInput.value = '';\n                fetchTodos();\n            } catch (error) {\n                console.error('新增待辦事項時出錯:', error);\n            }\n        }\n    });\n\n    // 標記完成/取消完成待辦事項\n    list.addEventListener('click', async (e) => {\n        if (e.target.classList.contains('complete-btn')) {\n            const id = e.target.dataset.id;\n            try {\n                await fetch(`api/todos/${id}`, { method: 'PUT' });\n                fetchTodos();\n            } catch (error) {\n                console.error('更新待辦事項時出錯:', error);\n            }\n        }\n\n        if (e.target.classList.contains('delete-btn')) {\n            const id = e.target.dataset.id;\n            try {\n                await fetch(`api/todos/${id}`, { method: 'DELETE' });\n                fetchTodos();\n            } catch (error) {\n                console.error('刪除待辦事項時出錯:', error);\n            }\n        }\n    });\n\n    // 初始化\n    fetchTodos();\n});"
